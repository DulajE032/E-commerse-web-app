name: Keep Backend Alive (Render Free Tier)

on:
  schedule:
    # Trigger every 14 minutes (Render spins down after 15 minutes of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$URL" ]; then
            echo "RENDER_BACKEND_URL secret is not set. Please add it to your GitHub Repository Secrets."
            exit 0
          fi
          echo "Pinging: $URL/health"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health")
          echo "HTTP Response Code: $RESPONSE"
          if [ "$RESPONSE" -eq 200 ]; then
            echo "Backend is active and warm!"
          else
            echo "Received HTTP $RESPONSE - Waking up backend..."
          fi
